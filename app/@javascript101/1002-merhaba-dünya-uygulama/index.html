          <script>
    function Program(files,options){
          options = options || {}
          let language = (options.language=="javascript" || options.language=="js" || options.language=="node" || options.language=="nodejs") ? "javascript" : "python"
          let runnerUrl = language=="javascript" ? "api-javascript.html" : "api-python-skulpt.html"
    
          let program = {
            response: "",
            onData  : function(e){console.log("PROGRAM::onData(" +JSON.stringify(e)+")")} ,
            onError : function(e){console.log("PROGRAM::onError("+JSON.stringify(e)+")")} ,
            onEnd   : function(e){console.log("PROGRAM::onEnd("  +JSON.stringify(e)+")")} ,
          }
    
          Program.frames = Program.frames || {}
          let iframe = Program.frames[language]
          if(!iframe){
            iframe = Program.frames[language] = document.createElement("iframe")
            iframe.src = runnerUrl
            iframe.onload = function(e){
              iframe.contentWindow.postMessage(JSON.stringify(files), "*");
            }
            document.body.append(iframe)
            iframe.style.display = "none";
            if(language=="javascript") iframe.setAttribute("sandbox","allow-scripts")
            
            
    
          }else{
            iframe.contentWindow.postMessage(JSON.stringify(files), "*");
          }
          
          window.onmessage = function(event) {
            let response = JSON.parse(event.data)
            if(response.onData !== undefined){
              program.onData(response.onData)
            }
            if(response.onEnd !== undefined){
              program.onEnd(response.onEnd)
            }
            if(response.onError !== undefined){
              program.onError(response.onError)
            }
          };
          
          
          return program
        }

    source = {"data":"- show_content = true\n- show_editor = true\n- show_terminal = true\n- language = \"javascript\"\n- title = \"📄 Merhaba Dünya : Kaçış Karakterleri\"\n- run = \"node main.js\"\n\n- parts/0:\n- text\n# 🎯 Kaçış Karakteri : ``\\n``\n\nMetnin içinde alt satıra geçmek istiyorsak ``\\n`` yazarız. Buna kaçış karakteri\n(escape character) denir. Ters bölü ``\\`` tek başına bir anlam taşımaz; yanındaki\nharfe özel bir görev verir. Böylece tek bir ``console.log`` ile iki satır yazarız.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(\"Birinci satır\\nİkinci satır\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nBirinci satır\nİkinci satır\n<\/code-view>\n\n# 🎯 1. Görev\n\n``Birinci satır`` ve ``İkinci satır`` metnini **iki satır** olarak yazdıran programı\nyazar mısın?\n\n- files/main.js/.block\n// iki metni alt alta yazdırır mısın?\nconsole.log(\"Birinci satır<<< ❓ >>>İkinci satır\");\n---------------------\n- tests/0/output\nBirinci satır\nİkinci satır\n\n---------------------\n- parts/1:\n- text\n# ✅ Tebrikler : ``\\t``\n\n``\\t`` bir **sekme** (tab) karakteridir; imleci bir sonraki durağa kaydırır. Sütunları\nhizalamak için kullanılır. Ekranda geniş bir boşluk gibi görünür.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(\"Ad\\tSoyad\");\nconsole.log(\"Ayşe\\tYılmaz\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nAd\tSoyad\nAyşe\tYılmaz\n<\/code-view>\n\n# 🎯 2. Görev\n\n``Şehir`` ile ``İstanbul`` arasına sekme koyan programı yazar mısın?\n\n- files/main.js/.block\n// araya bir sekme koyar mısın?\nconsole.log(\"Şehir<<< ❓ >>>İstanbul\");\n---------------------\n- tests/0/output\nŞehir\tİstanbul\n\n---------------------\n- parts/2:\n- text\n# 🛣️ Ters Bölü : ``\\\\``\n\nTek bir ters bölü ``\\`` yazmak istiyorsak iki kez yazarız: ``\\\\``. Çünkü tek ters\nbölü kaçış karakteridir ve yanındaki harfle birlikte okunur. Dosya yolları ve Windows\nyolları bunun en yaygın örneğidir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(\"C:\\\\Belgeler\\\\not.txt\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nC:\\Belgeler\\not.txt\n<\/code-view>\n\n# 🎯 3. Görev\n\nTerminale ``C:\\Belgeler\\not.txt`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// iki ters bölü yazarak yolu düzeltir misin?\nconsole.log(\"C:<<< ❓ >>>Belgeler<<< ❓ >>>not.txt\");\n---------------------\n- tests/0/output\nC:\\Belgeler\\not.txt\n\n---------------------\n- parts/3:\n- text\n# 💬 Çift Tırnak : ``\\\"``\n\nÇift tırnakla başlayan bir metnin içinde tekrar çift tırnak kullanmak istiyorsak\n``\\\"`` yazarız. Böylece JavaScript tırnağı metnin sonu sanmaz. Terminalde ise sadece\nçift tırnak görünür.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(\"Öğretmen \\\"Merhaba\\\" dedi.\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nÖğretmen \"Merhaba\" dedi.\n<\/code-view>\n\n# 🎯 4. Görev\n\nTerminale ``Öğretmen \"Merhaba\" dedi.`` yazdıran programı yazar mısın? İç tırnakları\nkaçış karakteri ile yazmalısın.\n\n- files/main.js/.block\n// iç tırnakları kaçış karakteri ile yazar mısın?\nconsole.log(\"Öğretmen <<< ❓ >>>Merhaba<<< ❓ >>> dedi.\");\n---------------------\n- tests/0/output\nÖğretmen \"Merhaba\" dedi.\n\n---------------------\n- parts/4:\n- text\n# 🔙 Şablon Metin (Backtick)\n\nÇok satırlı metinler ve araya değer koymak için **şablon metin** (template literal)\nkullanırız. Şablon metin geri tırnak `` ` `` ile yazılır. İçindeki ``${}`` alanına bir\ndeğişken ya da ifade yazabiliriz.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet ad = \"Ayşe\";\nconsole.log(`Merhaba ${ad}!`);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nMerhaba Ayşe!\n<\/code-view>\n\n# 🎯 5. Görev\n\n``Merhaba Mehmet!`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// şablon metne adı yerleştirir misin?\nlet ad = \"Mehmet\";\nconsole.log(`Merhaba ${<<< ❓ >>>}!`);\n---------------------\n- tests/0/output\nMerhaba Mehmet!\n\n---------------------\n- parts/5:\n- text\n# 🧮 ``${}`` İçinde Hesap\n\n``${}`` içine sadece değişken değil, hesap da yazabiliriz. JavaScript önce süslü\nparantezin içini hesaplar, sonra sonucu metne yerleştirir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet fiyat = 20;\nlet adet = 3;\nconsole.log(`Toplam: ${fiyat * adet} TL`);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nToplam: 60 TL\n<\/code-view>\n\n# 🎯 6. Görev\n\n``Toplam: 60 TL`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// toplam tutarı şablon metin içinde hesaplar mısın?\nlet fiyat = 20;\nlet adet = 3;\nconsole.log(`Toplam: ${fiyat <<< ❓ >>> adet} TL`);\n---------------------\n- tests/0/output\nToplam: 60 TL\n\n---------------------\n- tests/1/files/main.js/.block\n// toplam tutarı şablon metin içinde hesaplar mısın?\nlet fiyat = 15;\nlet adet = 4;\nconsole.log(`Toplam: ${fiyat <<< ❓ >>> adet} TL`);\n- tests/1/output\nToplam: 60 TL\n\n---------------------\n- parts/6:\n- text\n# 📄 Çok Satırlı Şablon Metin\n\nŞablon metin gerçek satır sonlarını da kabul eder. Yani ``\\n`` yazmadan, metni\nklavyede alt satıra geçirerek çok satırlı metin elde ederiz. Adres gibi satırlı\nbilgiler için idealdir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet adres = `Ayşe Yılmaz\nAtatürk Caddesi 12\nİstanbul`;\nconsole.log(adres);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nAyşe Yılmaz\nAtatürk Caddesi 12\nİstanbul\n<\/code-view>\n\n# 🎯 7. Görev\n\nÇok satırlı adrese **ikinci satırı** ekler misin?\n\n- files/main.js/.block\n// adrese sokak satırını ekler misin?\nlet adres = `Ayşe Yılmaz\n<<< ❓ >>>\nİstanbul`;\nconsole.log(adres);\n---------------------\n- tests/0/output\nAyşe Yılmaz\nAtatürk Caddesi 12\nİstanbul\n\n---------------------\n- parts/7:\n- text\n# 🔤 ``${}`` İçinde Metin ve Sayı\n\nŞablon metnin güzelliği: metni ve değişkeni karıştırırken ``+`` işaretine gerek\nkalmaz. Boşlukları da doğal biçimde yazarız.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet ürün = \"Kalem\";\nlet adet = 3;\nconsole.log(`${adet} adet ${ürün} aldım.`);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n3 adet Kalem aldım.\n<\/code-view>\n\n# 🎯 8. Görev\n\n``3 adet Kalem aldım.`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// kaç adet ve hangi ürün aldığını yazdırır mısın?\nlet ürün = \"Kalem\";\nlet adet = 3;\nconsole.log(`${<<< ❓ >>>} adet ${<<< ❓ >>>} aldım.`);\n---------------------\n- tests/0/output\n3 adet Kalem aldım.\n\n---------------------\n- parts/8:\n- text\n# 🪪 Uygulama : Kartvizit\n\nŞimdi öğrendiklerimizi birleştirelim. Kartvizitte her bilgi ayrı satırda olmalı, bunun\niçin ``\\n`` kullanıyoruz. Değerler de ``${}`` ile yerine yerleşiyor.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet ad = \"Ayşe Yılmaz\";\nlet iş = \"Frontend Geliştirici\";\nconsole.log(`Ad  : ${ad}\\nİş  : ${iş}`);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nAd  : Ayşe Yılmaz\nİş  : Frontend Geliştirici\n<\/code-view>\n\n# 🎯 9. Görev\n\nKartvizitte adı ve işi **iki ayrı satırda** yazdırır mısın?\n\n- files/main.js/.block\n// satırları birbirinden ayırır mısın?\nlet ad = \"Ayşe Yılmaz\";\nlet iş = \"Frontend Geliştirici\";\nconsole.log(`Ad  : ${ad}<<< ❓ >>>İş  : ${iş}`);\n---------------------\n- tests/0/output\nAd  : Ayşe Yılmaz\nİş  : Frontend Geliştirici\n\n---------------------\n- parts/9:\n- text\n# 🏷️ Uygulama : Ürün Etiketi\n\nBir ürün etiketi de aynı mantıkla hazırlanır: başlık tırnaklı, altında fiyatlar.\nSatır sonları ``\\n``, değerler ``${}`` ile yerleşir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet ürün = \"Kahve\";\nlet fiyat = 85;\nlet kdv = 15;\nconsole.log(`\"${ürün}\" etiketi\\nFiyat: ${fiyat} TL\\nKDV: ${kdv} TL\\nToplam: ${fiyat + kdv} TL`);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n\"Kahve\" etiketi\nFiyat: 85 TL\nKDV: 15 TL\nToplam: 100 TL\n<\/code-view>\n\n# 🎯 10. Görev\n\nEtikette toplam tutarı hesaplayıp ``Toplam: 100 TL`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// toplam tutarı şablon metin içinde hesaplar mısın?\nlet ürün = \"Kahve\";\nlet fiyat = 85;\nlet kdv = 15;\nconsole.log(`\"${ürün}\" etiketi\\nFiyat: ${fiyat} TL\\nKDV: ${kdv} TL\\nToplam: ${<<< ❓ >>>} TL`);\n---------------------\n- tests/0/output\n\"Kahve\" etiketi\nFiyat: 85 TL\nKDV: 15 TL\nToplam: 100 TL\n\n---------------------\n- parts/10:\n- text\n# 🏆 Mini Tekrar\n\nKaçış karakterleri ile şablon metni birleştirelim. Aşağıdaki örnek bir bilet özeti\nyazdırıyor: satırlar ``\\n`` ile ayrılıyor, değerler ``${}`` ile yerine yerleşiyor.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet etkinlik = \"Konser\";\nlet kişi = 4;\nlet bilet = 75;\nconsole.log(`Etkinlik : ${etkinlik}\\nKişi : ${kişi}\\nToplam : ${bilet * kişi} TL`);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nEtkinlik : Konser\nKişi : 4\nToplam : 300 TL\n<\/code-view>\n\n# 🎯 11. Görev\n\n``Etkinlik : Konser``, ``Kişi : 4`` ve ``Toplam : 300 TL`` satırlarını yazdıran\nprogramı yazar mısın?\n\n- files/main.js/.block\n// toplam tutarı hesaplar mısın?\nlet etkinlik = \"Konser\";\nlet kişi = 4;\nlet bilet = 75;\nconsole.log(`Etkinlik : ${etkinlik}\\nKişi : ${kişi}\\nToplam : ${bilet <<< ❓ >>> kişi} TL`);\n---------------------\n- tests/0/output\nEtkinlik : Konser\nKişi : 4\nToplam : 300 TL\n\n---------------------\n- tests/1/files/main.js/.block\n// toplam tutarı hesaplar mısın?\nlet etkinlik = \"Tiyatro\";\nlet kişi = 3;\nlet bilet = 120;\nconsole.log(`Etkinlik : ${etkinlik}\\nKişi : ${kişi}\\nToplam : ${bilet <<< ❓ >>> kişi} TL`);\n- tests/1/output\nEtkinlik : Tiyatro\nKişi : 3\nToplam : 360 TL\n\n---------------------\n","next":"@javascript101/1010-değişkenler-number-tam-sayılar"};
