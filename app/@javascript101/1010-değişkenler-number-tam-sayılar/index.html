          <script>
    function Program(files,options){
          options = options || {}
          let language = (options.language=="javascript" || options.language=="js" || options.language=="node" || options.language=="nodejs") ? "javascript" : "python"
          let runnerUrl = language=="javascript" ? "api-javascript.html" : "api-python-skulpt.html"
    
          let program = {
            response: "",
            onData  : function(e){console.log("PROGRAM::onData(" +JSON.stringify(e)+")")} ,
            onError : function(e){console.log("PROGRAM::onError("+JSON.stringify(e)+")")} ,
            onEnd   : function(e){console.log("PROGRAM::onEnd("  +JSON.stringify(e)+")")} ,
          }
    
          Program.frames = Program.frames || {}
          let iframe = Program.frames[language]
          if(!iframe){
            iframe = Program.frames[language] = document.createElement("iframe")
            iframe.src = runnerUrl
            iframe.onload = function(e){
              iframe.contentWindow.postMessage(JSON.stringify(files), "*");
            }
            document.body.append(iframe)
            iframe.style.display = "none";
            if(language=="javascript") iframe.setAttribute("sandbox","allow-scripts")
            
            
    
          }else{
            iframe.contentWindow.postMessage(JSON.stringify(files), "*");
          }
          
          window.onmessage = function(event) {
            let response = JSON.parse(event.data)
            if(response.onData !== undefined){
              program.onData(response.onData)
            }
            if(response.onEnd !== undefined){
              program.onEnd(response.onEnd)
            }
            if(response.onError !== undefined){
              program.onError(response.onError)
            }
          };
          
          
          return program
        }

    source = {"data":"- show_content = true\n- show_editor = true\n- show_terminal = true\n- language = \"javascript\"\n- title = \"🔢 Değişkenler number : Tam Sayılar\"\n- run = \"node main.js\"\n\n- parts/0:\n- text\n# 🔢 **number** : Tam Sayılar\n\nJavaScript'te bir tam sayıyı saklamak için ``let`` anahtar kelimesini kullanırız.\n``let`` \"değişken tanımla\" demektir; sağındaki değer değişkenin içine konur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet yıl = 2023;\nconsole.log(yıl);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n2023\n<\/code-view>\n\n# 🎯 1. Görev\n\nTerminale ``2023`` yazdıran programı yazar mısın? ``yıl`` değişkenine ``2023`` değerini ver.\n\n- files/main.js/.block\n// yıl değişkenini 2023 yapar mısın?\nlet yıl = <<< ❓ >>>;\nconsole.log(yıl);\n---------------------\n- tests/0/output\n2023\n\n---------------------\n- parts/1:\n- text\n# ✅ Tebrikler\n\nBir değişkenin değerini sonradan değiştirebiliriz. Yeni değeri ``=`` işareti ile yazarız;\nprogram yukarıdan aşağıya çalıştığı için en son atanan değer geçerli olur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayaç = 1;\nsayaç = 2;\nsayaç = 3;\nconsole.log(sayaç);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n3\n<\/code-view>\n\n# 🎯 2. Görev\n\n``sayaç`` değişkenine önce ``1``, sonra ``2``, en son ``3`` değerini veren programı yazar mısın?\n\n- files/main.js/.block\n// sayaç değişkenini en son 3 yapan programı yazar mısın?\nlet sayaç = 1;\nsayaç = <<< ❓ >>>;\nconsole.log(sayaç);\n---------------------\n- tests/0/output\n3\n\n---------------------\n- parts/2:\n- text\n# 💡 const : Sabit Değer\n\nDeğeri hiç değişmeyecek sayılar için ``const`` kullanırız. ``const`` ile tanımlanan\ndeğişkene sonradan yeni bir değer atanamaz; atamaya çalışırsan program hata verir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconst birGün = 24;\nconsole.log(\"Bir günde\", birGün, \"saat vardır.\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nBir günde 24 saat vardır.\n<\/code-view>\n\n# 🎯 3. Görev\n\n``Bir günde 24 saat vardır.`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// bir günde kaç saat vardır?\nconst birGün = <<< ❓ >>>;\nconsole.log(\"Bir günde\", birGün, \"saat vardır.\");\n---------------------\n- tests/0/output\nBir günde 24 saat vardır.\n\n---------------------\n- parts/3:\n- text\n# ➕ Toplama Operatörü\n\nSayıları ``+`` işareti ile toplarız. Değişkenleri de birbirine ekleyebiliriz.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet elma = 3;\nlet armut = 5;\nconsole.log(\"Toplam meyve:\", elma + armut);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nToplam meyve: 8\n<\/code-view>\n\n# 🎯 4. Görev\n\n``elma`` ve ``armut`` sayılarını toplayıp ``Toplam meyve: 8`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// iki sayıyı toplar mısın?\nlet elma = 3;\nlet armut = 5;\nconsole.log(\"Toplam meyve:\", elma <<< ❓ >>> armut);\n---------------------\n- tests/0/output\nToplam meyve: 8\n\n---------------------\n- tests/1/files/main.js/.block\n// iki sayıyı toplar mısın?\nlet elma = 10;\nlet armut = 7;\nconsole.log(\"Toplam meyve:\", elma <<< ❓ >>> armut);\n- tests/1/output\nToplam meyve: 17\n\n---------------------\n- parts/4:\n- text\n# ➖ Çıkarma Operatörü ve Negatif Sayılar\n\n``-`` işareti sayıları çıkarır. Sonuç sıfırdan küçükse **negatif** bir sayı elde ederiz.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sıcaklık = 5;\nsıcaklık = sıcaklık - 12;\nconsole.log(sıcaklık);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n&minus;7\n<\/code-view>\n\n# 🎯 5. Görev\n\nHava sıcaklığı ``5`` iken ``12`` derece düşerse terminale ``-7`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// sıcaklığı 12 derece düşürür müsün?\nlet sıcaklık = 5;\nsıcaklık = sıcaklık <<< ❓ >>> 12;\nconsole.log(sıcaklık);\n---------------------\n- tests/0/output\n&minus;7\n\n---------------------\n- tests/1/files/main.js/.block\n// sıcaklığı 12 derece düşürür müsün?\nlet sıcaklık = 20;\nsıcaklık = sıcaklık <<< ❓ >>> 12;\nconsole.log(sıcaklık);\n- tests/1/output\n8\n\n---------------------\n- parts/5:\n- text\n# ✖️ Çarpma Operatörü\n\nSayıları çarpmak için ``*`` işaretini kullanırız.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet kutu = 4;\nlet kalem = 6;\nconsole.log(kutu * kalem, \"kalem vardır.\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n24 kalem vardır.\n<\/code-view>\n\n# 🎯 6. Görev\n\n4 kutuda, her kutuda 6 kalem varsa ``24 kalem vardır.`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// kutu sayısı ile kalem sayısını çarpar mısın?\nlet kutu = 4;\nlet kalem = 6;\nconsole.log(kutu <<< ❓ >>> kalem, \"kalem vardır.\");\n---------------------\n- tests/0/output\n24 kalem vardır.\n\n---------------------\n- tests/1/files/main.js/.block\n// kutu sayısı ile kalem sayısını çarpar mısın?\nlet kutu = 7;\nlet kalem = 8;\nconsole.log(kutu <<< ❓ >>> kalem, \"kalem vardır.\");\n- tests/1/output\n56 kalem vardır.\n\n---------------------\n- parts/6:\n- text\n# ➗ Bölme Operatörü\n\n``/`` işareti bölme yapar. Tam bölünen sayılarda sonuç yine tam sayı olur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet para = 100;\nlet kişi = 4;\nconsole.log(\"Kişi başına\", para / kişi, \"lira düşer.\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nKişi başına 25 lira düşer.\n<\/code-view>\n\n# 🎯 7. Görev\n\n100 lirayı 4 kişiye eşit paylaştırıp ``Kişi başına 25 lira düşer.`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// parayı kişi sayısına böler misin?\nlet para = 100;\nlet kişi = 4;\nconsole.log(\"Kişi başına\", para <<< ❓ >>> kişi, \"lira düşer.\");\n---------------------\n- tests/0/output\nKişi başına 25 lira düşer.\n\n---------------------\n- tests/1/files/main.js/.block\n// parayı kişi sayısına böler misin?\nlet para = 120;\nlet kişi = 6;\nconsole.log(\"Kişi başına\", para <<< ❓ >>> kişi, \"lira düşer.\");\n- tests/1/output\nKişi başına 20 lira düşer.\n\n---------------------\n- parts/7:\n- text\n# 🍬 Kalan (mod) Operatörü\n\n``%`` işareti bölme işleminden kalanı verir. Bir sayının başka bir sayıya tam bölünüp\nbölünmediğini anlamak için çok kullanışlıdır. ``17 % 5`` işleminin sonucu ``2`` olur;\nçünkü 17 içinde 3 tane 5 vardır ve 2 artar.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet şeker = 17;\nlet çocuk = 5;\nconsole.log(şeker % çocuk, \"şeker artar.\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n2 şeker artar.\n<\/code-view>\n\n# 🎯 8. Görev\n\n17 şekeri 5 çocuğa eşit paylaştırınca ``2 şeker artar.`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// bölümden kalanı bulur musun?\nlet şeker = 17;\nlet çocuk = 5;\nconsole.log(şeker <<< ❓ >>> çocuk, \"şeker artar.\");\n---------------------\n- tests/0/output\n2 şeker artar.\n\n---------------------\n- tests/1/files/main.js/.block\n// bölümden kalanı bulur musun?\nlet şeker = 23;\nlet çocuk = 5;\nconsole.log(şeker <<< ❓ >>> çocuk, \"şeker artar.\");\n- tests/1/output\n3 şeker artar.\n\n---------------------\n- parts/8:\n- text\n# ⏫ Üs Alma Operatörü\n\n``**`` işareti bir sayının kuvvetini alır. ``3 ** 2`` demek \"3'ün 2. kuvveti\" yani\n``3 * 3`` demektir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet kenar = 3;\nconsole.log(\"Karenin alanı:\", kenar ** 2);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nKarenin alanı: 9\n<\/code-view>\n\n# 🎯 9. Görev\n\nBir kenarı ``3`` olan karenin alanını ``Karenin alanı: 9`` şeklinde yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// kenar uzunluğunun karesini alır mısın?\nlet kenar = 3;\nconsole.log(\"Karenin alanı:\", kenar <<< ❓ >>> 2);\n---------------------\n- tests/0/output\nKarenin alanı: 9\n\n---------------------\n- tests/1/files/main.js/.block\n// kenar uzunluğunun karesini alır mısın?\nlet kenar = 5;\nconsole.log(\"Karenin alanı:\", kenar <<< ❓ >>> 2);\n- tests/1/output\nKarenin alanı: 25\n\n---------------------\n- parts/9:\n- text\n# 💡 Okunaklı Büyük Sayılar\n\nÇok sıfırlı sayıları okumak zordur. JavaScript'te sayıları ``_`` ile gruplayabiliriz;\nbu işaret sayının değerini değiştirmez, sadece okunmasını kolaylaştırır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet nüfus = 84_000_000;\nconsole.log(nüfus);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n84000000\n<\/code-view>\n\n# 🎯 10. Görev\n\nTürkiye'nin nüfusunu ``84_000_000`` olarak tanımlayıp terminale ``84000000`` yazdıran\nprogramı yazar mısın?\n\n- files/main.js/.block\n// nüfusu okunaklı biçimde tanımlar mısın?\nlet nüfus = <<< ❓ >>>;\nconsole.log(nüfus);\n---------------------\n- tests/0/output\n84000000\n\n---------------------\n- parts/10:\n- text\n# 🔍 Sayı mı, Değil mi?\n\n``Number.isInteger()`` verilen değerin tam sayı olup olmadığını söyler. Sonuç\n``true`` (doğru) ya da ``false`` (yanlış) olur. ``Number.MAX_SAFE_INTEGER`` ise\nJavaScript'in güvenle saklayabildiği en büyük tam sayıdır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(Number.isInteger(42));\nconsole.log(Number.isInteger(3.14));\nconsole.log(Number.MAX_SAFE_INTEGER);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\ntrue\nfalse\n9007199254740991\n<\/code-view>\n\n# 🎯 11. Görev\n\n``42`` ve ``3.14`` değerlerinin tam sayı olup olmadığını, ardından güvenli en büyük tam\nsayıyı yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// 42 tam sayı mı, 3.14 tam sayı mı?\nconsole.log(Number.isInteger(<<< ❓ >>>));\nconsole.log(Number.isInteger(<<< ❓ >>>));\nconsole.log(Number.MAX_SAFE_INTEGER);\n---------------------\n- tests/0/output\ntrue\nfalse\n9007199254740991\n\n---------------------\n- parts/11:\n- text\n# 🔄 Metni Sayıya Çevirme\n\nTerminalden ya da bir metinden gelen sayılar aslında metindir. ``Number()``\nfonksiyonu metni gerçek sayıya çevirir. Böylece toplama yapabiliriz.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet metin = \"42\";\nlet sayı = Number(metin);\nconsole.log(sayı + 8);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n50\n<\/code-view>\n\n# 🎯 12. Görev\n\n``\"42\"`` metnini sayıya çevirip ``8`` ile toplayan ve terminale ``50`` yazdıran programı\nyazar mısın?\n\n- files/main.js/.block\n// metni sayıya çevirir misin?\nlet metin = \"42\";\nlet sayı = <<< ❓ >>>(metin);\nconsole.log(sayı + 8);\n---------------------\n- tests/0/output\n50\n\n---------------------\n- tests/1/files/main.js/.block\n// metni sayıya çevirir misin?\nlet metin = \"100\";\nlet sayı = <<< ❓ >>>(metin);\nconsole.log(sayı + 8);\n- tests/1/output\n108\n\n---------------------\n- parts/12:\n- text\n# 🏆 Mini Tekrar\n\nÖğrendiklerini birleştirelim: bir ürünün fiyatı ile adetini çarpıp toplam tutarı\nyazdıralım.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet fiyat = 250;\nlet adet = 3;\nlet toplam = fiyat * adet;\nconsole.log(\"Toplam:\", toplam, \"TL\");\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nToplam: 750 TL\n<\/code-view>\n\n# 🎯 13. Görev\n\n3 adet ürünün tanesi 250 lira ise ``Toplam: 750 TL`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// toplam tutarı hesaplar mısın?\nlet fiyat = 250;\nlet adet = 3;\nlet toplam = fiyat <<< ❓ >>> adet;\nconsole.log(\"Toplam:\", toplam, \"TL\");\n---------------------\n- tests/0/output\nToplam: 750 TL\n\n---------------------\n- tests/1/files/main.js/.block\n// toplam tutarı hesaplar mısın?\nlet fiyat = 120;\nlet adet = 5;\nlet toplam = fiyat <<< ❓ >>> adet;\nconsole.log(\"Toplam:\", toplam, \"TL\");\n- tests/1/output\nToplam: 600 TL\n\n---------------------\n","next":"@javascript101/1011-değişkenler-number-ondalıklı"};
