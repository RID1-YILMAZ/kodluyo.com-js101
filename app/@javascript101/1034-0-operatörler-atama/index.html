          <script>
    function Program(files,options){
          options = options || {}
          let language = (options.language=="javascript" || options.language=="js" || options.language=="node" || options.language=="nodejs") ? "javascript" : "python"
          let runnerUrl = language=="javascript" ? "api-javascript.html" : "api-python-skulpt.html"
    
          let program = {
            response: "",
            onData  : function(e){console.log("PROGRAM::onData(" +JSON.stringify(e)+")")} ,
            onError : function(e){console.log("PROGRAM::onError("+JSON.stringify(e)+")")} ,
            onEnd   : function(e){console.log("PROGRAM::onEnd("  +JSON.stringify(e)+")")} ,
          }
    
          Program.frames = Program.frames || {}
          let iframe = Program.frames[language]
          if(!iframe){
            iframe = Program.frames[language] = document.createElement("iframe")
            iframe.src = runnerUrl
            iframe.onload = function(e){
              iframe.contentWindow.postMessage(JSON.stringify(files), "*");
            }
            document.body.append(iframe)
            iframe.style.display = "none";
            if(language=="javascript") iframe.setAttribute("sandbox","allow-scripts")
            
            
    
          }else{
            iframe.contentWindow.postMessage(JSON.stringify(files), "*");
          }
          
          window.onmessage = function(event) {
            let response = JSON.parse(event.data)
            if(response.onData !== undefined){
              program.onData(response.onData)
            }
            if(response.onEnd !== undefined){
              program.onEnd(response.onEnd)
            }
            if(response.onError !== undefined){
              program.onError(response.onError)
            }
          };
          
          
          return program
        }

    source = {"data":"- show_content = true\n- show_editor = true\n- show_terminal = true\n- language = \"javascript\"\n- title = \"🔁 Operatörler : Atama\"\n- run = \"node main.js\"\n\n- parts/0:\n- text\n# 🔁 **Atama** Operatörleri\n\nBir değişkene değer vermek için ``=`` kullanırız. Aynı değişkeni kendisiyle işleme sokup\nsonucu yine ona yazmak çok sık olur; bunun için kısa yollar vardır. ``puan += 5`` demek\n``puan = puan + 5`` demektir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet puan = 10;\npuan += 5;\nconsole.log(puan);\n\nlet mesaj = \"Merhaba\";\nmesaj += \" Dünya\";\nconsole.log(mesaj);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n15\nMerhaba Dünya\n<\/code-view>\n\n# 🎯 1. Görev\n\n``15`` ve ``Merhaba Dünya`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// puanı 5 artır, metnin sonuna devamını ekle\nlet puan = 10;\npuan <<< ❓ >>> 5;\nconsole.log(puan);\n\nlet mesaj = \"Merhaba\";\nmesaj <<< ❓ >>> \" Dünya\";\nconsole.log(mesaj);\n---------------------\n- tests/0/output\n15\nMerhaba Dünya\n\n---------------------\n- tests/1/files/main.js/.block\n// puanı 5 artır, metnin sonuna devamını ekle\nlet puan = 20;\npuan <<< ❓ >>> 5;\nconsole.log(puan);\n\nlet mesaj = \"Merhaba\";\nmesaj <<< ❓ >>> \" Dünya\";\nconsole.log(mesaj);\n- tests/1/output\n25\nMerhaba Dünya\n\n---------------------\n- parts/1:\n- text\n# ✅ Tebrikler : ``-=`` (Çıkararak Atama)\n\n``bakiye -= 30`` demek ``bakiye = bakiye - 30`` demektir. Hesaptan para çekmek, stoktan\nürün düşmek gibi işlemlerde bu kısa yolu kullanırız.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet bakiye = 100;\nbakiye -= 30;\nconsole.log(bakiye);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n70\n<\/code-view>\n\n# 🎯 2. Görev\n\n100 liradan 30 lira harcanınca terminale ``70`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// bakiyeden 30 lira düşer misin?\nlet bakiye = 100;\nbakiye <<< ❓ >>> 30;\nconsole.log(bakiye);\n---------------------\n- tests/0/output\n70\n\n---------------------\n- tests/1/files/main.js/.block\n// bakiyeden 30 lira düşer misin?\nlet bakiye = 50;\nbakiye <<< ❓ >>> 30;\nconsole.log(bakiye);\n- tests/1/output\n20\n\n---------------------\n- parts/2:\n- text\n# ✅ Tebrikler : ``*=`` (Çarparak Atama)\n\n``fiyat *= 3`` demek ``fiyat = fiyat * 3`` demektir. Zam yapmak ya da aynı üründen birkaç\ntane almak gibi işlemlerde kullanılır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet fiyat = 20;\nfiyat *= 3;\nconsole.log(fiyat);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n60\n<\/code-view>\n\n# 🎯 3. Görev\n\nTanesi 20 lira olan üründen 3 tane alınınca terminale ``60`` yazdıran programı yazar\nmısın?\n\n- files/main.js/.block\n// fiyatı 3 ile çarpar mısın?\nlet fiyat = 20;\nfiyat <<< ❓ >>> 3;\nconsole.log(fiyat);\n---------------------\n- tests/0/output\n60\n\n---------------------\n- tests/1/files/main.js/.block\n// fiyatı 3 ile çarpar mısın?\nlet fiyat = 15;\nfiyat <<< ❓ >>> 3;\nconsole.log(fiyat);\n- tests/1/output\n45\n\n---------------------\n- parts/3:\n- text\n# ✅ Tebrikler : ``/=`` (Bölerek Atama)\n\n``para /= 4`` demek ``para = para / 4`` demektir. Tam bölünmeyen sayılarda sonuç ondalıklı\nçıkabilir; JavaScript bu durumda virgül değil nokta kullanır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet para = 100;\npara /= 4;\nconsole.log(para);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n25\n<\/code-view>\n\n# 🎯 4. Görev\n\n100 lirayı 4 kişiye paylaştırınca terminale ``25`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// parayı 4 kişiye böler misin?\nlet para = 100;\npara <<< ❓ >>> 4;\nconsole.log(para);\n---------------------\n- tests/0/output\n25\n\n---------------------\n- tests/1/files/main.js/.block\n// parayı 4 kişiye böler misin?\nlet para = 90;\npara <<< ❓ >>> 4;\nconsole.log(para);\n- tests/1/output\n22.5\n\n---------------------\n- parts/4:\n- text\n# ✅ Tebrikler : ``%=`` (Kalanı Atama)\n\n``şeker %= 5`` demek ``şeker = şeker % 5`` demektir ve değişkende bölümden kalanı\nbırakır. Bir sayının başka bir sayıya tam bölünüp bölünmediğini anlamak için idealdir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet şeker = 17;\nşeker %= 5;\nconsole.log(şeker);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n2\n<\/code-view>\n\n# 🎯 5. Görev\n\n17 şekeri 5'erli paylaştırınca kalan ``2`` şekeri terminale yazdıran programı yazar\nmısın?\n\n- files/main.js/.block\n// bölümden kalanı değişkende bırakır mısın?\nlet şeker = 17;\nşeker <<< ❓ >>> 5;\nconsole.log(şeker);\n---------------------\n- tests/0/output\n2\n\n---------------------\n- tests/1/files/main.js/.block\n// bölümden kalanı değişkende bırakır mısın?\nlet şeker = 23;\nşeker <<< ❓ >>> 5;\nconsole.log(şeker);\n- tests/1/output\n3\n\n---------------------\n- parts/5:\n- text\n# ✅ Tebrikler : ``**=`` (Kuvvetini Atama)\n\n``sayı **= 3`` demek ``sayı = sayı ** 3`` demektir. Yani değişkenin kendisini 3. kuvvete\nyükseltir. ``2 ** 3`` sonucu ``8`` olduğu için ``sayı`` değişkeni ``8`` olur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayı = 2;\nsayı **= 3;\nconsole.log(sayı);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n8\n<\/code-view>\n\n# 🎯 6. Görev\n\n``2`` sayısını 3. kuvvete yükseltip terminale ``8`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// sayıyı 3. kuvvete yükseltir misin?\nlet sayı = 2;\nsayı <<< ❓ >>> 3;\nconsole.log(sayı);\n---------------------\n- tests/0/output\n8\n\n---------------------\n- tests/1/files/main.js/.block\n// sayıyı 3. kuvvete yükseltir misin?\nlet sayı = 3;\nsayı <<< ❓ >>> 3;\nconsole.log(sayı);\n- tests/1/output\n27\n\n---------------------\n- parts/6:\n- text\n# ✅ Tebrikler : ``++`` ve ``--``\n\nBir sayıyı yalnızca 1 artırmak ya da 1 azaltmak için ``++`` ve ``--`` kullanılır.\nOperatör **sonra** yazılırsa (``sayaç++``) önce eski değer kullanılır, sonra artırılır.\nOperatör **önce** yazılırsa (``--sayaç``) önce azaltılır, sonra yeni değer kullanılır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayaç = 5;\nconsole.log(sayaç++);\nconsole.log(sayaç);\nconsole.log(--sayaç);\nconsole.log(sayaç);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n5\n6\n5\n5\n<\/code-view>\n\n# 🎯 7. Görev\n\n``5``, ``6``, ``5`` ve ``5`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// ++ ile artır, -- ile azalt\nlet sayaç = 5;\nconsole.log(sayaç<<< ❓ >>>);\nconsole.log(sayaç);\nconsole.log(<<< ❓ >>>sayaç);\nconsole.log(sayaç);\n---------------------\n- tests/0/output\n5\n6\n5\n5\n\n---------------------\n- tests/1/files/main.js/.block\n// ++ ile artır, -- ile azalt\nlet sayaç = 9;\nconsole.log(sayaç<<< ❓ >>>);\nconsole.log(sayaç);\nconsole.log(<<< ❓ >>>sayaç);\nconsole.log(sayaç);\n- tests/1/output\n9\n10\n9\n9\n\n---------------------\n- parts/7:\n- text\n# ✅ Tebrikler : ``||=`` ve ``??=``\n\n``ad ||= \"Misafir\"`` demek \"``ad`` yanlışsa ``Misafir`` yaz\" demektir. ``??=`` ise yalnızca\ndeğişken null ya da undefined ise devreye girer. Bu yüzden ``0 ??= 99`` sonucu ``0``\nkalır, çünkü ``0`` geçerli bir değerdir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet ad = \"\";\nad ||= \"Misafir\";\nconsole.log(ad);\n\nlet yaş = null;\nyaş ??= 18;\nconsole.log(yaş);\n\nlet sıfır = 0;\nsıfır ??= 99;\nconsole.log(sıfır);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\nMisafir\n18\n0\n<\/code-view>\n\n# 🎯 8. Görev\n\n``Misafir``, ``18`` ve ``0`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// ad boşsa varsayılan ver, sıfırı ise koru\nlet ad = \"\";\nad <<< ❓ >>> \"Misafir\";\nconsole.log(ad);\n\nlet yaş = null;\nyaş <<< ❓ >>> 18;\nconsole.log(yaş);\n\nlet sıfır = 0;\nsıfır <<< ❓ >>> 99;\nconsole.log(sıfır);\n---------------------\n- tests/0/output\nMisafir\n18\n0\n\n---------------------\n- tests/1/files/main.js/.block\n// ad boşsa varsayılan ver, sıfırı ise koru\nlet ad = \"Ali\";\nad <<< ❓ >>> \"Misafir\";\nconsole.log(ad);\n\nlet yaş = null;\nyaş <<< ❓ >>> 18;\nconsole.log(yaş);\n\nlet sıfır = 0;\nsıfır <<< ❓ >>> 99;\nconsole.log(sıfır);\n- tests/1/output\nAli\n18\n0\n\n---------------------\n- parts/8:\n- text\n# ✅ Tebrikler : ``&&=``\n\n``stok &&= stok * 2`` demek \"``stok`` doğruysa iki katına çıkar\" demektir. Değişken\nyanlışsa (``0`` gibi) hiçbir şey yapılmaz ve eski değeri kalır. Böylece atamayı bir koşula\nbağlamış oluruz.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet stok = 5;\nstok &&= stok * 2;\nconsole.log(stok);\n\nlet tükenmiş = 0;\ntükenmiş &&= 42;\nconsole.log(tükenmiş);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n10\n0\n<\/code-view>\n\n# 🎯 9. Görev\n\n``10`` ve ``0`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// stok varsa iki katına çıkar\nlet stok = 5;\nstok <<< ❓ >>> stok * 2;\nconsole.log(stok);\n\nlet tükenmiş = 0;\ntükenmiş <<< ❓ >>> 42;\nconsole.log(tükenmiş);\n---------------------\n- tests/0/output\n10\n0\n\n---------------------\n- tests/1/files/main.js/.block\n// stok varsa iki katına çıkar\nlet stok = 3;\nstok <<< ❓ >>> stok * 2;\nconsole.log(stok);\n\nlet tükenmiş = 0;\ntükenmiş <<< ❓ >>> 42;\nconsole.log(tükenmiş);\n- tests/1/output\n6\n0\n\n---------------------\n- parts/9:\n- text\n# 🏆 Mini Tekrar\n\nÖğrendiklerini birleştirelim: bir sayaçla adım adım hesap yapalım. ``+=`` ile 10 ekle,\n``-=`` ile 4 çıkar, ``*=`` ile 2 ile çarp, ``/=`` ile 3'e böl. Sıfırdan başlayınca sonuç\n``4`` olur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayaç = 0;\nsayaç += 10;\nsayaç -= 4;\nsayaç *= 2;\nsayaç /= 3;\nconsole.log(sayaç);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n4\n<\/code-view>\n\n# 🎯 10. Görev\n\n``4`` yazdıran programı yazar mısın? Cevabı verecek operatörleri sırayla tamamla.\n\n- files/main.js/.block\n// 10 ekle, 4 çıkar, 2 ile çarp, 3'e böl\nlet sayaç = 0;\nsayaç <<< ❓ >>> 10;\nsayaç <<< ❓ >>> 4;\nsayaç <<< ❓ >>> 2;\nsayaç <<< ❓ >>> 3;\nconsole.log(sayaç);\n---------------------\n- tests/0/output\n4\n\n---------------------\n- tests/1/files/main.js/.block\n// 10 ekle, 4 çıkar, 2 ile çarp, 3'e böl\nlet sayaç = 6;\nsayaç <<< ❓ >>> 10;\nsayaç <<< ❓ >>> 4;\nsayaç <<< ❓ >>> 2;\nsayaç <<< ❓ >>> 3;\nconsole.log(sayaç);\n- tests/1/output\n8\n\n---------------------\n","next":"@javascript101/1035-0-operatörler-aitlik"};
