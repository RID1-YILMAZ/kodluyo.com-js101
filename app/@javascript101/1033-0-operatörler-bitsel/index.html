    function Program(files,options){
          options = options || {}
          let language = (options.language=="javascript" || options.language=="js" || options.language=="node" || options.language=="nodejs") ? "javascript" : "python"
          let runnerUrl = language=="javascript" ? "api-javascript.html" : "api-python-skulpt.html"
    
          let program = {
            response: "",
            onData  : function(e){console.log("PROGRAM::onData(" +JSON.stringify(e)+")")} ,
            onError : function(e){console.log("PROGRAM::onError("+JSON.stringify(e)+")")} ,
            onEnd   : function(e){console.log("PROGRAM::onEnd("  +JSON.stringify(e)+")")} ,
          }
    
          Program.frames = Program.frames || {}
          let iframe = Program.frames[language]
          if(!iframe){
            iframe = Program.frames[language] = document.createElement("iframe")
            iframe.src = runnerUrl
            iframe.onload = function(e){
              iframe.contentWindow.postMessage(JSON.stringify(files), "*");
            }
            document.body.append(iframe)
            iframe.style.display = "none";
            if(language=="javascript") iframe.setAttribute("sandbox","allow-scripts")
            
            
    
          }else{
            iframe.contentWindow.postMessage(JSON.stringify(files), "*");
          }
          
          window.onmessage = function(event) {
            if (typeof event.data !== "string") return;
            let response;
            try { response = JSON.parse(event.data) } catch (e) { return }
            if (!response || typeof response !== "object") return;
            if(response.onData !== undefined){
              program.onData(response.onData)
            }
            if(response.onEnd !== undefined){
              program.onEnd(response.onEnd)
            }
            if(response.onError !== undefined){
              program.onError(response.onError)
            }
          };
          
          
          return program
        }

    source = {"data":"- show_content = true\n- show_editor = true\n- show_terminal = true\n- language = \"javascript\"\n- title = \"🔢 Operatörler : Bitsel\"\n- run = \"node main.js\"\n\n- parts/0:\n- text\n# 🔢 **Bitsel** Operatörler\n\nBilgisayar sayıları ikili (binary) tabanda, yani 0 ve 1'lerle saklar. Bitsel operatörler\nbu 0 ve 1'ler üzerinde tek tek çalışır. Bir sayının ikili hâlini görmek için\n``toString(2)`` kullanırız.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayı = 5;\nconsole.log(sayı.toString(2));\nconsole.log((13).toString(2));\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n101\n1101\n<\/code-view>\n\n# 🎯 1. Görev\n\n``6`` sayısının ikili hâlini (``110``) yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// 6 sayısını ikili tabanda gösterir misin?\nlet sayı = 6;\nconsole.log(sayı.toString(<<< ❓ >>>));\n---------------------\n- tests/0/output\n110\n\n---------------------\n- parts/1:\n- text\n# ✅ Tebrikler : ``&`` (Ve)\n\n``&`` iki sayının bitlerini karşılaştırır; bir bit **her iki sayıda da** 1 ise sonuç 1\nolur. ``6 & 3`` hesabında ``110`` ile ``011`` karşılaştırılır ve ``010`` yani ``2``\nbulunur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log((6).toString(2), (3).toString(2));\nconsole.log(6 & 3);\nconsole.log(6 & 5);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n110 11\n2\n4\n<\/code-view>\n\n# 🎯 2. Görev\n\n``2`` ve ``4`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// ortak bitleri bulur musun?\nconsole.log(6 <<< ❓ >>> 3);\nconsole.log(6 <<< ❓ >>> 5);\n---------------------\n- tests/0/output\n2\n4\n\n---------------------\n- tests/1/files/main.js/.block\n// ortak bitleri bulur musun?\nconsole.log(12 <<< ❓ >>> 10);\nconsole.log(12 <<< ❓ >>> 3);\n- tests/1/output\n8\n0\n\n---------------------\n- parts/2:\n- text\n# ✅ Tebrikler : ``|`` (Veya)\n\n``|`` işleminde bitlerden **en az biri** 1 ise sonuç 1 olur. ``6 | 3`` hesabında ``110``\nile ``011`` birleşir ve ``111`` yani ``7`` bulunur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(6 | 3);\nconsole.log(4 | 1);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n7\n5\n<\/code-view>\n\n# 🎯 3. Görev\n\n``7`` ve ``5`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// bitleri birleştirir misin?\nconsole.log(6 <<< ❓ >>> 3);\nconsole.log(4 <<< ❓ >>> 1);\n---------------------\n- tests/0/output\n7\n5\n\n---------------------\n- tests/1/files/main.js/.block\n// bitleri birleştirir misin?\nconsole.log(12 <<< ❓ >>> 3);\nconsole.log(8 <<< ❓ >>> 1);\n- tests/1/output\n15\n9\n\n---------------------\n- parts/3:\n- text\n# ✅ Tebrikler : ``^`` (Özel Veya)\n\n``^`` işleminde bitler **farklıysa** sonuç 1, aynıysa 0 olur. Bir sayıyı kendisiyle\nkarşılaştırınca tüm bitler aynı olacağı için sonuç ``0`` çıkar.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(6 ^ 3);\nconsole.log(5 ^ 5);\nconsole.log(10 ^ 3);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n5\n0\n9\n<\/code-view>\n\n# 🎯 4. Görev\n\n``5``, ``0`` ve ``9`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// farklı bitleri bulur musun?\nconsole.log(6 <<< ❓ >>> 3);\nconsole.log(5 <<< ❓ >>> 5);\nconsole.log(10 <<< ❓ >>> 3);\n---------------------\n- tests/0/output\n5\n0\n9\n\n---------------------\n- tests/1/files/main.js/.block\n// farklı bitleri bulur musun?\nconsole.log(12 <<< ❓ >>> 10);\nconsole.log(7 <<< ❓ >>> 7);\nconsole.log(15 <<< ❓ >>> 1);\n- tests/1/output\n6\n0\n14\n\n---------------------\n- parts/4:\n- text\n# ✅ Tebrikler : ``~`` (Değil)\n\n``~`` tüm bitleri tersine çevirir: 1'ler 0, 0'lar 1 olur. Sonuç her zaman\n``-(sayı + 1)`` biçiminde çıkar. Bu yüzden ``~5`` değeri ``-6``'dır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(~5);\nconsole.log(~0);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n&minus;6\n&minus;1\n<\/code-view>\n\n# 🎯 5. Görev\n\n``-6`` ve ``-1`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// bitleri tersine çevirir misin?\nconsole.log(<<< ❓ >>>5);\nconsole.log(<<< ❓ >>>0);\n---------------------\n- tests/0/output\n&minus;6\n&minus;1\n\n---------------------\n- tests/1/files/main.js/.block\n// bitleri tersine çevirir misin?\nconsole.log(<<< ❓ >>>9);\nconsole.log(<<< ❓ >>>1);\n- tests/1/output\n&minus;10\n&minus;2\n\n---------------------\n- parts/5:\n- text\n# ✅ Tebrikler : ``<<`` (Sola Kaydırma)\n\n``<<`` bitleri sola kaydırır ve boş kalan yerlere 0 yazar. Bir bit sola kaydırmak sayıyı\n2 ile çarpmak demektir; iki bit kaydırmak 4 ile çarpar. ``3 << 2`` bu yüzden ``12`` olur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayı = 3;\nconsole.log(sayı << 2);\nconsole.log(sayı << 3);\nconsole.log(sayı * 4);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n12\n24\n12\n<\/code-view>\n\n# 🎯 6. Görev\n\n``12``, ``24`` ve ``12`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// sola kaydırma ile 4 ve 8 ile çarpar mısın?\nlet sayı = 3;\nconsole.log(sayı <<< ❓ >>> 2);\nconsole.log(sayı <<< ❓ >>> 3);\nconsole.log(sayı * 4);\n---------------------\n- tests/0/output\n12\n24\n12\n\n---------------------\n- tests/1/files/main.js/.block\n// sola kaydırma ile 4 ve 8 ile çarpar mısın?\nlet sayı = 5;\nconsole.log(sayı <<< ❓ >>> 2);\nconsole.log(sayı <<< ❓ >>> 3);\nconsole.log(sayı * 4);\n- tests/1/output\n20\n40\n20\n\n---------------------\n- parts/6:\n- text\n# ✅ Tebrikler : ``>>`` (Sağa Kaydırma)\n\n``>>`` bitleri sağa kaydırır; bu işlem sayıyı 2'nin kuvvetlerine böler. ``20 >> 2``\n``20 / 4`` yani ``5`` demektir. İşaret biti korunduğu için negatif sayılar negatif kalır.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayı = 20;\nconsole.log(sayı >> 2);\nconsole.log(-8 >> 1);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n5\n&minus;4\n<\/code-view>\n\n# 🎯 7. Görev\n\n``5`` ve ``-4`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// sağa kaydırma ile böler misin?\nlet sayı = 20;\nconsole.log(sayı <<< ❓ >>> 2);\nconsole.log(-8 <<< ❓ >>> 1);\n---------------------\n- tests/0/output\n5\n&minus;4\n\n---------------------\n- tests/1/files/main.js/.block\n// sağa kaydırma ile böler misin?\nlet sayı = 100;\nconsole.log(sayı <<< ❓ >>> 2);\nconsole.log(-16 <<< ❓ >>> 2);\n- tests/1/output\n25\n&minus;4\n\n---------------------\n- parts/7:\n- text\n# ✅ Tebrikler : ``>>>`` (İşaretsiz Sağa Kaydırma)\n\n``>>>`` de sağa kaydırır ama boş kalan yerlere işaret bitini kopyalamaz, hep 0 yazar.\nBu yüzden sonuç işaretsiz 32 bitlik bir sayıya dönüşür. ``-1 >>> 0`` değeri bu yüzden\n``4294967295`` olur.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconsole.log(-1 >>> 0);\nconsole.log(-8 >>> 1);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n4294967295\n2147483644\n<\/code-view>\n\n# 🎯 8. Görev\n\n``2147483644`` ve ``4294967295`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// işaretsiz sağa kaydırma kullanır mısın?\nconsole.log(-8 <<< ❓ >>> 1);\nconsole.log(-1 <<< ❓ >>> 0);\n---------------------\n- tests/0/output\n2147483644\n4294967295\n\n---------------------\n- tests/1/files/main.js/.block\n// işaretsiz sağa kaydırma kullanır mısın?\nconsole.log(-16 <<< ❓ >>> 2);\nconsole.log(-2 <<< ❓ >>> 0);\n- tests/1/output\n1073741820\n4294967294\n\n---------------------\n- parts/8:\n- text\n# ✅ Tebrikler : Bayraklar (Flags)\n\nHer bit bir yetkiyi temsil edebilir: ``4`` okuma, ``2`` yazma, ``1`` silme olsun. ``|``\nile yetkileri tek bir sayıda toplarız. ``&`` ile de \"bu yetki var mı?\" diye sorarız;\nböylece üç yetkiyi tek bir sayıda saklamış oluruz.\n\n<code-view name=\"main.js\" language=\"javascript\">\nconst OKU = 4;\nconst YAZ = 2;\nconst SİL = 1;\nlet izin = OKU | YAZ;\nconsole.log(izin);\nconsole.log((izin & OKU) === OKU);\nconsole.log((izin & SİL) === SİL);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n6\ntrue\nfalse\n<\/code-view>\n\n# 🎯 9. Görev\n\n``5``, ``true`` ve ``false`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// okuma ve silme yetkisini birleştirir misin?\nconst OKU = 4;\nconst YAZ = 2;\nconst SİL = 1;\nlet izin = OKU <<< ❓ >>> SİL;\nconsole.log(izin);\nconsole.log((izin & OKU) === OKU);\nconsole.log((izin & YAZ) === YAZ);\n---------------------\n- tests/0/output\n5\ntrue\nfalse\n\n---------------------\n- tests/1/files/main.js/.block\n// okuma ve silme yetkisini birleştirir misin?\nconst OKU = 4;\nconst YAZ = 2;\nconst SİL = 1;\nlet izin = OKU <<< ❓ >>> YAZ;\nconsole.log(izin);\nconsole.log((izin & OKU) === OKU);\nconsole.log((izin & YAZ) === YAZ);\n- tests/1/output\n6\ntrue\ntrue\n\n---------------------\n- parts/9:\n- text\n# 🏆 Mini Tekrar\n\nBir sayının ikili hâlini yazıp bit kaydırma ile yarısını bulalım. ``& 1`` ile de sayının\ntek mi çift mi olduğunu anlarız: son bit 1 ise tek, 0 ise çifttir. ``13`` tek bir sayıdır\nve ikili hâli ``1101``'dir.\n\n<code-view name=\"main.js\" language=\"javascript\">\nlet sayı = 13;\nconsole.log(sayı.toString(2));\nconsole.log(sayı >> 1);\nconsole.log(sayı & 1);\n<\/code-view>\n\n<code-view name=\"Terminal\" language=\"bash\">\n1101\n6\n1\n<\/code-view>\n\n# 🎯 10. Görev\n\n``1101``, ``6`` ve ``1`` yazdıran programı yazar mısın?\n\n- files/main.js/.block\n// ikili hâlini yaz, yarısını al, tek mi çift mi anla\nlet sayı = 13;\nconsole.log(sayı.toString(2));\nconsole.log(sayı <<< ❓ >>> 1);\nconsole.log(sayı & <<< ❓ >>>);\n---------------------\n- tests/0/output\n1101\n6\n1\n\n---------------------\n","next":"@javascript101/1034-0-operatörler-atama"};
